name: Day18 Docker Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/day18-app:latest .

    - name: Tag Version
      run: docker tag ${{ secrets.DOCKER_USERNAME }}/day18-app:latest ${{ secrets.DOCKER_USERNAME }}/day18-app:v1

    - name: Push Latest
      run: docker push ${{ secrets.DOCKER_USERNAME }}/day18-app:latest

    - name: Push Version
      run: docker push ${{ secrets.DOCKER_USERNAME }}/day18-app:v1
